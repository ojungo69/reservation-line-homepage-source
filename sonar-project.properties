# Repository-controlled CI-based analysis for SonarQube Cloud.
# Keep SONAR_CI_ENABLED disabled until Automatic Analysis is turned off.
sonar.organization=ojungo69
sonar.projectKey=ojungo69_reservation-line-homepage
sonar.projectName=reservation-line-homepage
# Preserve the current product version during the source/operations split.
sonar.projectVersion=0.2.0
sonar.sourceEncoding=UTF-8

# Product source. Operational scripts stay out of this first rollout to keep the
# paid LOC scope focused on code that ships to customers and operators.
sonar.sources=src,public,admin-app/src

# Root tests live separately; admin-app tests are co-located with its source.
sonar.tests=test,admin-app/src
sonar.test.inclusions=test/**/*.test.ts,test/**/*.test.mjs,admin-app/src/**/*.test.ts,admin-app/src/**/*.test.tsx
# Generated build output, type-only API declarations and script-free legal examples
# do not contain shipped executable source. Customer JS, CSS and index HTML stay
# in scope. These exclusions preserve the existing product analysis boundary.
sonar.exclusions=src/worker-configuration.d.ts,admin-app/src/**/*.test.ts,admin-app/src/**/*.test.tsx,**/node_modules/**,**/dist/**,coverage/**,admin-app/coverage/**,public/admin-app/**,admin-app/src/types/api.ts,public/legal/**

# Use both TypeScript projects so semantic analysis covers the Worker and admin SPA.
sonar.typescript.tsconfigPaths=tsconfig.json,admin-app/tsconfig.app.json

# The CI workflow produces both reports before the trusted scanner workflow runs.
sonar.javascript.lcov.reportPaths=coverage/lcov.info,admin-app/coverage/lcov.info
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# Public static assets do not yet have browser-instrumented coverage. Excluding
# them avoids reporting synthetic 0% coverage while retaining static analysis.
sonar.coverage.exclusions=public/**,src/worker-configuration.d.ts

# These are intentional mirrors/boilerplate, not shared executable logic.
sonar.cpd.exclusions=admin-app/src/types/api.ts,public/legal/**
